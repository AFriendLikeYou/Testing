<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Your Name</h1>
      <p class="muted">Product designer.</p>
      <p>I design digital products and brands for companies big and small. Previously design lead at a couple of studios you may have heard of.</p>
      <p><a href="mailto:hello@example.com" data-convert>Get in touch ↗</a></p>
    </header>
    <p class="muted section-label">Latest Work</p>
    <section id="work" aria-label="Projects"></section>
  </main>

  <div id="dashboard" class="dashboard" hidden>
    <div class="dash-panel">
      <div class="dash-head">
        <span class="muted">Layout performance</span>
        <span id="dash-meta" class="muted"></span>
        <button id="dash-close" class="dash-close" aria-label="Close">×</button>
      </div>
      <div id="dash-grid" class="dash-grid"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
